- CosmoKramer:
    - Adguard-Home:
        description: DNS filter
        icon: adguard-home.png
        href: "https://adguard.vamshi.ca"
        widget:
          type: adguard
          url: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}"
          username: "{{HOMEPAGE_VAR_ADGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_ADGUARD_PWD}}"
        server: my-docker
        container: adguardhome

    - Home-Assistant:
        icon: home-assistant.png
        href: "https://ha.vamshi.ca"
        widget:
          type: homeassistant
          url: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}:8123"
          key: "{{HOMEPAGE_VAR_HOME_ASSISTANT_TOKEN}}"
          fields: ["people_home", "lights_on", "switches_on"]
        server: my-docker
        container: homeassistant

    - Immich:
        icon: immich.png
        href: "https://immich.vamshi.ca"
        widget:
          type: immich
          url: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}:2283"
          key: "{{HOMEPAGE_VAR_IMMICH_KEY}}"
          version: 2
        server: my-docker
        container: immich_server
        showStats: true

    - Jellyfin:
        icon: jellyfin.png
        href: "https://jellyfin.vamshi.ca"
        widget:
          url: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}:8096"
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2
          type: jellyfin
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true
        server: my-docker
        container: jellyfin

    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        widget:
          type: tailscale
          deviceid: nHfVxmHy1511CNTRL
          key: "{{HOMEPAGE_VAR_TAILSCALE_KEY}}"

    - Cloudflare:
        icon: cloudflare.png
        href: https://dash.cloudflare.com
        widget:
          type: cloudflared
          accountid: "{{HOMEPAGE_VAR_CF_ACCOUNT_ID}}"
          tunnelid: "{{HOMEPAGE_VAR_CF_TUNNEL_ID}}"
          key: "{{HOMEPAGE_VAR_CF_KEY}}"
        server: my-docker
        container: cloudflared

    - Diun:
        icon: diun.png
        # href: https://crazymax.dev
        description: Image Updates Tracker
        server: my-docker
        container: diun-diun-1


    - Uptime-Kuma:
        icon: uptime-kuma
        href: https://uptime-kuma.vamshi.ca/status/default
        widget:
            type: uptimekuma
            url: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}:3001"
            key: "{{HOMEPAGE_VAR_UPTIME_KUMA_KEY}}"
            slug: default
