---
# For configuration options and examples, please see:
# https://gethomepage.dev/configs/services/

- CosmoKramer:
    - Pi-hole:
        icon: pi-hole.png
        href: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}/admin/"
        description: Network-wide ad blocker
        widget:
          type: pihole
          url: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}"
          key: "{{HOMEPAGE_VAR_PIHOLE_TOKEN}}"
          version: 6
          fields:
            - queries
            - blocked
            - blocked_percent
            - gravity
            - unique_clients

    - Home-Assistant:
        icon: home-assistant.png
        href: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}:8123"
        widget:
          type: homeassistant
          url: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}:8123"
          key: "{{HOMEPAGE_VAR_HOME_ASSISTANT_TOKEN}}"
          fields: ["people_home", "lights_on", "switches_on"]

    - Immich:
        icon: immich.png
        href: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}:2283"
        widget:
          type: immich
          url: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}:2283"
          key: r8DAyGl5U29yy0z9zvwCUUH5qH2BDhitqGta0qVnn2o
          version: 2
          #fields: ["users" ,"photos", "videos", "storage"]

    - Jellyfin:
        icon: jellyfin.png
        href: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}:8096"
        widget:
          url: "http://{{HOMEPAGE_VAR_COSMO_KRAMER}}:8096"
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2
          type: jellyfin
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true

    - Tailscale:
        icon: tailscale.png
        href: https://login.tailscale.com/admin/machines
        widget:
          type: tailscale
          deviceid: nHfVxmHy1511CNTRL
          key: tskey-api-kLsdcdYMzB11CNTRL-ahnHBJJvHyG35F1cs4yPyGCZCExyFnD8J
